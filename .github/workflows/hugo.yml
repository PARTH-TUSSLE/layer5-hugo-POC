name: hugo-site
on:
  pull_request:
  push:
    branches: [master, hugo-migration]

concurrency: { group: "hugo-${{ github.ref }}", cancel-in-progress: true }

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10        # the Gatsby job needed far more; this is a tripwire for regressions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }       # only for migration tooling + Pagefind; not used to build the site
      - uses: peaceiris/actions-hugo@v3
        with: { hugo-version: "0.145.0", extended: true }   # pin; bump deliberately

      - name: Tooling tests
        run: node --test "scripts/test/*.test.mjs"

      - name: Build site
        run: hugo --minify --gc --logLevel warn --printPathWarnings

      - name: Search index (Pagefind)
        run: npx -y pagefind --site public

      - name: Link check (internal)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir "${{ github.workspace }}/public" 'public/**/*.html'
          fail: true

      - name: Benchmark (1,210 synthetic pages)
        run: ./scripts/bench.sh

      - uses: actions/upload-artifact@v4
        with: { name: site, path: public, retention-days: 7 }

